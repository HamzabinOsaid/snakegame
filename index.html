<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake Ultimate Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.screen { display:none; padding:20px; }
.active { display:block; }

button {
  padding:10px 14px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
}

canvas {
  background:#111827;
  border:2px solid #334155;
}

/* glow animation */
@keyframes glow {
  0% { box-shadow: 0 0 5px #22c55e; }
  50% { box-shadow: 0 0 20px #22c55e; }
  100% { box-shadow: 0 0 5px #22c55e; }
}
</style>
</head>

<body>

<h1>🐍 Snake Ultimate Pro</h1>

<!-- HOME -->
<div id="home" class="screen active">
  <button onclick="startGame(1)">▶ Start</button>
  <button onclick="startGame(save.bestLevel || 1)">🔥 Continue</button>
  <button onclick="showShop()">🛒 Shop</button>
  <button onclick="dailyReward()">🎁 Daily Reward</button>
  <button onclick="resetAll()">♻ Reset</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div>
Score: <span id="score"></span> |
Coins: <span id="coins"></span> |
Level: <span id="level"></span>
</div>

<canvas id="game"></canvas><br>
<button onclick="home()">Exit</button>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
<h2>Shop</h2>

<button onclick="skin='green'">Green (Free)</button>
<button onclick="buy('blue',10)">Blue (10)</button>
<button onclick="buy('red',20)">Red (20)</button>

<br><br>
<button onclick="home()">Back</button>
</div>

<script>

/* ---------------- SAVE ---------------- */
let save = JSON.parse(localStorage.getItem("snakeSave")) || {
coins:0,
bestLevel:1,
lastReward:0
};

function saveGame(){
localStorage.setItem("snakeSave",JSON.stringify(save));
}

/* ---------------- SCREEN ---------------- */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}
function home(){show("home");}
function showShop(){show("shop");}

/* ---------------- GAME ---------------- */
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let size=20, cols, rows;

function resize(){
c.width=400;
c.height=400;
cols=c.width/size;
rows=c.height/size;
}
resize();

let snake,dir,food,score,level,speed,skin="green",last=0;

/* ---------------- SOUND ---------------- */
const eatSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
const gameOver = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

/* ---------------- START ---------------- */
function startGame(lvl){
show("gameScreen");

level=lvl;
score=0;
speed=200-(level*10);

snake=[{x:10,y:10}];
dir={x:1,y:0};
food=randomFood();

updateUI();
}

/* ---------------- FOOD ---------------- */
function randomFood(){
return{
x:Math.floor(Math.random()*cols),
y:Math.floor(Math.random()*rows)
};
}

/* ---------------- UI ---------------- */
function updateUI(){
document.getElementById("score").innerText=score;
document.getElementById("coins").innerText=save.coins;
document.getElementById("level").innerText=level;
}

/* ---------------- LOOP ---------------- */
function loop(t){
requestAnimationFrame(loop);
if(t-last<speed)return;
last=t;

move();
draw();
}
requestAnimationFrame(loop);

/* ---------------- MOVE ---------------- */
function move(){

let head={
x:snake[0].x+dir.x,
y:snake[0].y+dir.y
};

/* collision */
if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||
snake.some(s=>s.x===head.x&&s.y===head.y)){
gameOver.play();
navigator.vibrate?.(200);
save.bestLevel=Math.max(save.bestLevel,level);
saveGame();
startGame(level);
return;
}

snake.unshift(head);

/* eat */
if(head.x===food.x&&head.y===food.y){
score++;
save.coins++;
eatSound.play();
navigator.vibrate?.(50);

if(score%5===0){
level++;
speed=Math.max(60,speed-15);
}

food=randomFood();
saveGame();
}else{
snake.pop();
}

updateUI();
}

/* ---------------- DRAW (ANIMATION) ---------------- */
function draw(){

ctx.fillStyle="#111827";
ctx.fillRect(0,0,c.width,c.height);

ctx.fillStyle="yellow";
ctx.fillRect(food.x*size,food.y*size,size,size);

/* glowing snake */
snake.forEach((s,i)=>{
ctx.shadowBlur=10;
ctx.shadowColor=skin==="green"?"#22c55e":skin==="blue"?"#3b82f6":"#ef4444";

ctx.fillStyle=
skin==="green"?"#22c55e":
skin==="blue"?"#3b82f6":"#ef4444";

ctx.fillRect(s.x*size,s.y*size,size,size);
});

ctx.shadowBlur=0;
}

/* ---------------- CONTROLS ---------------- */
window.addEventListener("keydown",e=>{
if(e.key==="ArrowUp"&&dir.y===0)dir={x:0,y:-1};
if(e.key==="ArrowDown"&&dir.y===0)dir={x:0,y:1};
if(e.key==="ArrowLeft"&&dir.x===0)dir={x:-1,y:0};
if(e.key==="ArrowRight"&&dir.x===0)dir={x:1,y:0};
});

/* mobile swipe */
let sx,sy;
window.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
});

window.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-sx;
let dy=e.changedTouches[0].clientY-sy;

if(Math.abs(dx)>Math.abs(dy)){
if(dx>0&&dir.x===0)dir={x:1,y:0};
else if(dx<0&&dir.x===0)dir={x:-1,y:0};
}else{
if(dy>0&&dir.y===0)dir={x:0,y:1};
else if(dy<0&&dir.y===0)dir={x:0,y:-1};
}
});

/* ---------------- SHOP ---------------- */
function buy(color,cost){
if(save.coins<cost)return alert("Not enough coins");
save.coins-=cost;
skin=color;
saveGame();
updateUI();
}

/* ---------------- DAILY ---------------- */
function dailyReward(){
let now=Date.now();
if(now-save.lastReward<86400000){
return alert("Come back later!");
}
let r=10+Math.floor(Math.random()*20);
save.coins+=r;
save.lastReward=now;
saveGame();
updateUI();
alert("Daily +" + r);
}

/* ---------------- RESET ---------------- */
function resetAll(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
