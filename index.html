<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake Game Pro</title>
<style>
  body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin: 10px;
  }

  #gameContainer {
    position: relative;
  }

  canvas {
    background: #111827;
    border: 2px solid #334155;
    display: block;
  }

  #ui {
    margin: 10px;
    display: flex;
    gap: 20px;
    font-size: 16px;
  }

  #shop {
    margin-top: 10px;
  }

  button {
    padding: 6px 10px;
    margin: 5px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>

<h1>Snake Game Pro</h1>

<div id="ui">
  <div>Score: <span id="score">0</span></div>
  <div>Coins: <span id="coins">0</span></div>
  <div>Level: <span id="level">1</span></div>
</div>

<div id="gameContainer">
  <canvas id="game"></canvas>
</div>

<div id="shop">
  <button onclick="setSkin('green')">Green Snake</button>
  <button onclick="setSkin('blue')">Blue Snake (10 coins)</button>
  <button onclick="setSkin('red')">Red Snake (20 coins)</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let tile = 20;
let cols, rows;

function resize() {
  canvas.width = Math.min(window.innerWidth - 20, 420);
  canvas.height = canvas.width;
  cols = Math.floor(canvas.width / tile);
  rows = Math.floor(canvas.height / tile);
}
resize();
window.addEventListener("resize", resize);

let snake = [{x: 10, y: 10}];
let dir = {x: 1, y: 0};
let food = spawnFood();

let score = 0;
let coins = 0;
let level = 1;
let speed = 200;
let lastTime = 0;

let skin = "green";

function spawnFood() {
  return {
    x: Math.floor(Math.random() * cols),
    y: Math.floor(Math.random() * rows)
  };
}

function draw() {
  ctx.fillStyle = "#111827";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = "yellow";
  ctx.fillRect(food.x * tile, food.y * tile, tile, tile);

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle =
      skin === "green" ? "#22c55e" :
      skin === "blue" ? "#3b82f6" :
      "#ef4444";

    ctx.fillRect(s.x * tile, s.y * tile, tile, tile);
  });
}

function update() {
  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  // FIXED collision (proper boundary check)
  if (
    head.x < 0 || head.y < 0 ||
    head.x >= cols || head.y >= rows ||
    snake.some(s => s.x === head.x && s.y === head.y)
  ) {
    resetGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    coins++;

    if (score % 5 === 0) {
      level++;
      speed = Math.max(60, speed - 20);
    }

    food = spawnFood();
  } else {
    snake.pop();
  }

  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("level").textContent = level;
}

function resetGame() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  score = 0;
  level = 1;
  speed = 200;
}

function loop(time = 0) {
  if (time - lastTime > speed) {
    update();
    draw();
    lastTime = time;
  }
  requestAnimationFrame(loop);
}
loop();

// keyboard
window.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && dir.y === 0) dir = {x: 0, y: -1};
  if (e.key === "ArrowDown" && dir.y === 0) dir = {x: 0, y: 1};
  if (e.key === "ArrowLeft" && dir.x === 0) dir = {x: -1, y: 0};
  if (e.key === "ArrowRight" && dir.x === 0) dir = {x: 1, y: 0};
});

// mobile swipe
let startX, startY;
window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

window.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - startX;
  let dy = e.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x === 0) dir = {x: 1, y: 0};
    else if (dx < 0 && dir.x === 0) dir = {x: -1, y: 0};
  } else {
    if (dy > 0 && dir.y === 0) dir = {x: 0, y: 1};
    else if (dy < 0 && dir.y === 0) dir = {x: 0, y: -1};
  }
});

// skins
function setSkin(s) {
  if (s === "blue" && coins < 10) return alert("Need 10 coins");
  if (s === "red" && coins < 20) return alert("Need 20 coins");
  skin = s;
}
</script>

</body>
</html>
