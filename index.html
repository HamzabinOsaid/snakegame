<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake Ultimate Pro+</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.screen { display:none; padding:20px; }
.active { display:block; }

button {
  padding:10px 14px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

canvas {
  background:#111827;
  border:2px solid #334155;
  box-shadow:0 0 10px #22c55e;
}

/* TOP HUD ALWAYS VISIBLE */
#topbar {
  display:flex;
  justify-content:center;
  gap:20px;
  padding:10px;
  background:#0b1220;
  border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<!-- TOP COINS DISPLAY (FIX) -->
<div id="topbar">
  💰 Coins: <span id="coinsTop">0</span>
  🏆 Best: <span id="bestTop">1</span>
</div>

<h1>🐍 Snake Ultimate Pro+</h1>

<!-- HOME -->
<div id="home" class="screen active">
  <button onclick="startGame(1)">▶ Start</button>
  <button onclick="startGame(save.bestLevel || 1)">🔥 Continue</button>
  <button onclick="openShop()">🛒 Shop</button>
  <button onclick="dailyReward()">🎁 Daily Reward</button>
  <button onclick="resetAll()">♻ Reset</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div>
Score: <span id="score"></span> |
Level: <span id="level"></span>
</div>

<canvas id="game"></canvas><br>
<button onclick="goHome()">🚪 Exit</button>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
<h2>Shop</h2>

<button onclick="skin='green'">Green (Free)</button>
<button onclick="buySkin('blue',10)">Blue (10)</button>
<button onclick="buySkin('red',20)">Red (20)</button>

<br><br>
<button onclick="goHome()">⬅ Back</button>
</div>

<script>

/* ================= SAVE ================= */
let save = JSON.parse(localStorage.getItem("snakeSave")) || {
coins:0,
bestLevel:1,
lastReward:0
};

function saveGame(){
localStorage.setItem("snakeSave",JSON.stringify(save));
}

/* ================= SCREEN FIX ================= */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

/* IMPORTANT FIX → refresh UI after screen switch */
updateTop();
}

/* Shop FIXED */
function openShop(){
show("shop");
}

/* ================= TOP BAR ================= */
function updateTop(){
document.getElementById("coinsTop").innerText = save.coins;
document.getElementById("bestTop").innerText = save.bestLevel;
}

/* ================= GAME ================= */
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let size=20,cols,rows;

function resize(){
c.width=400;
c.height=400;
cols=c.width/size;
rows=c.height/size;
}
resize();

let snake,dir,food,score,level,speed,last=0,skin="green",running=false;

/* ================= START ================= */
function startGame(lvl){
show("gameScreen");

running=true;

level=lvl;
score=0;
speed=200-(level*10);

snake=[{x:10,y:10}];
dir={x:1,y:0};
food=randomFood();

updateUI();
updateTop();
}

/* ================= FOOD ================= */
function randomFood(){
return{
x:Math.floor(Math.random()*cols),
y:Math.floor(Math.random()*rows)
};
}

/* ================= UI ================= */
function updateUI(){
document.getElementById("score").innerText=score;
document.getElementById("level").innerText=level;
updateTop();
}

/* ================= EXIT FIX ================= */
function goHome(){
running=false;
show("home");
}

/* ================= LOOP ================= */
function loop(t){
requestAnimationFrame(loop);

if(!running) return;
if(t-last<speed)return;
last=t;

move();
draw();
}
requestAnimationFrame(loop);

/* ================= MOVE ================= */
function move(){

let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||
snake.some(s=>s.x===head.x&&s.y===head.y)){

save.bestLevel=Math.max(save.bestLevel,level);
saveGame();

startGame(level);
return;
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;
save.coins++;
food=randomFood();
saveGame();
}else{
snake.pop();
}

updateUI();
}

/* ================= DRAW ================= */
function draw(){

ctx.fillStyle="#111827";
ctx.fillRect(0,0,c.width,c.height);

ctx.fillStyle="yellow";
ctx.fillRect(food.x*size,food.y*size,size,size);

snake.forEach(s=>{
ctx.fillStyle=
skin==="green"?"#22c55e":
skin==="blue"?"#3b82f6":"#ef4444";

ctx.fillRect(s.x*size,s.y*size,size,size);
});
}

/* ================= CONTROLS ================= */
window.addEventListener("keydown",e=>{
if(e.key==="ArrowUp"&&dir.y===0)dir={x:0,y:-1};
if(e.key==="ArrowDown"&&dir.y===0)dir={x:0,y:1};
if(e.key==="ArrowLeft"&&dir.x===0)dir={x:-1,y:0};
if(e.key==="ArrowRight"&&dir.x===0)dir={x:1,y:0};
});

/* ================= SHOP ================= */
function buySkin(color,cost){
if(save.coins<cost)return alert("Not enough coins");
save.coins-=cost;
skin=color;
saveGame();
updateTop();
}

/* ================= DAILY ================= */
function dailyReward(){
let now=Date.now();
if(now-save.lastReward<86400000){
return alert("Come back later!");
}
let r=10+Math.floor(Math.random()*20);
save.coins+=r;
save.lastReward=now;
saveGame();
updateTop();
alert("Daily +" + r);
}

/* ================= RESET ================= */
function resetAll(){
localStorage.clear();
location.reload();
}

/* INIT */
updateTop();

</script>

</body>
</html>
