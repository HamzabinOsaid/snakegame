<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake Game Pro+</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
  }

  h1 { margin: 10px; }

  .screen {
    display: none;
    padding: 20px;
  }

  .active {
    display: block;
  }

  button {
    padding: 10px 14px;
    margin: 6px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 14px;
  }

  button:hover { background: #1d4ed8; }

  canvas {
    background: #111827;
    border: 2px solid #334155;
  }

  #hud {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 10px;
  }

  .shop-item {
    margin: 10px;
    padding: 10px;
    border: 1px solid #334155;
    border-radius: 10px;
  }
</style>
</head>

<body>

<h1>🐍 Snake Game Pro+</h1>

<!-- HOME -->
<div id="home" class="screen active">
  <button onclick="startGame()">▶ Play</button>
  <button onclick="showShop()">🛒 Shop</button>
  <button onclick="resetProgress()">♻ Reset Progress</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Coins: <span id="coins">0</span></div>
    <div>Level: <span id="level">1</span></div>
  </div>

  <canvas id="game"></canvas>
  <br>
  <button onclick="goHome()">⬅ Exit</button>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
  <h2>Skin Shop</h2>

  <div class="shop-item">
    Green Snake (Free)<br>
    <button onclick="setSkin('green')">Select</button>
  </div>

  <div class="shop-item">
    Blue Snake (10 coins)<br>
    <button onclick="buySkin('blue', 10)">Buy / Select</button>
  </div>

  <div class="shop-item">
    Red Snake (20 coins)<br>
    <button onclick="buySkin('red', 20)">Buy / Select</button>
  </div>

  <button onclick="goHome()">⬅ Back</button>
</div>

<script>
/* ---------------- SCREEN SYSTEM ---------------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  showScreen('gameScreen');
  resetGame();
  resize();
}

function showShop() {
  showScreen('shop');
}

function goHome() {
  showScreen('home');
}

/* ---------------- GAME SETUP ---------------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let tile = 20;
let cols, rows;

function resize() {
  canvas.width = Math.min(window.innerWidth - 20, 420);
  canvas.height = canvas.width;
  cols = Math.floor(canvas.width / tile);
  rows = Math.floor(canvas.height / tile);
}
window.addEventListener("resize", resize);

let snake, dir, food;
let score = 0, coins = 0, level = 1;
let speed = 200;
let lastTime = 0;
let skin = "green";

/* ---------------- GAME LOGIC ---------------- */
function resetGame() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  food = spawnFood();

  score = 0;
  level = 1;
  speed = 200;
}

function spawnFood() {
  return {
    x: Math.floor(Math.random() * cols),
    y: Math.floor(Math.random() * rows)
  };
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("level").textContent = level;
}

function update() {
  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  // FIXED collision
  if (
    head.x < 0 || head.y < 0 ||
    head.x >= cols || head.y >= rows ||
    snake.some(s => s.x === head.x && s.y === head.y)
  ) {
    startGame(); // restart clean
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    coins++;

    if (score % 5 === 0) {
      level++;
      speed = Math.max(60, speed - 15);
    }

    food = spawnFood();
  } else {
    snake.pop();
  }

  updateUI();
}

function draw() {
  ctx.fillStyle = "#111827";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = "yellow";
  ctx.fillRect(food.x * tile, food.y * tile, tile, tile);

  // snake
  snake.forEach(s => {
    ctx.fillStyle =
      skin === "green" ? "#22c55e" :
      skin === "blue" ? "#3b82f6" :
      "#ef4444";

    ctx.fillRect(s.x * tile, s.y * tile, tile, tile);
  });
}

function loop(time = 0) {
  if (document.getElementById("gameScreen").classList.contains("active")) {
    if (time - lastTime > speed) {
      update();
      draw();
      lastTime = time;
    }
  }
  requestAnimationFrame(loop);
}
loop();

/* ---------------- CONTROLS ---------------- */
window.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && dir.y === 0) dir = {x: 0, y: -1};
  if (e.key === "ArrowDown" && dir.y === 0) dir = {x: 0, y: 1};
  if (e.key === "ArrowLeft" && dir.x === 0) dir = {x: -1, y: 0};
  if (e.key === "ArrowRight" && dir.x === 0) dir = {x: 1, y: 0};
});

/* mobile swipe */
let sx, sy;
window.addEventListener("touchstart", e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
});

window.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - sx;
  let dy = e.changedTouches[0].clientY - sy;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x === 0) dir = {x: 1, y: 0};
    else if (dx < 0 && dir.x === 0) dir = {x: -1, y: 0};
  } else {
    if (dy > 0 && dir.y === 0) dir = {x: 0, y: 1};
    else if (dy < 0 && dir.y === 0) dir = {x: 0, y: -1};
  }
});

/* ---------------- SHOP ---------------- */
function setSkin(s) {
  skin = s;
}

function buySkin(s, cost) {
  if (coins < cost) {
    alert("Not enough coins!");
    return;
  }
  coins -= cost;
  skin = s;
  updateUI();
}

/* ---------------- RESET ---------------- */
function resetProgress() {
  coins = 0;
  alert("Progress reset!");
}
</script>

</body>
</html>
